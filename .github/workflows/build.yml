# Build GIF Face Swap (Windows x64 portable zip), test packaged exe, publish GitHub Release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create / update the GitHub Release with the zip"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  GLOG_minloglevel: "2"
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-win.txt

      - name: Runner info
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM | Format-List
          [System.Environment]::OSVersion.VersionString

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements-win.txt
          python -c "import onnxruntime, cv2, PySide6, numpy, PIL; print(onnxruntime.__version__, onnxruntime.get_available_providers(), cv2.__version__, PySide6.__version__, PIL.__version__)"

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: .models-cache
          key: models-gfs-v1-${{ hashFiles('gfs/models.py') }}

      - name: Prefetch models (FaceFusion assets, SHA-256)
        shell: pwsh
        run: |
          $env:GFS_MODELS = "$PWD\.models-cache"
          python scripts/prefetch_models.py light

      - name: Ensure test GIF
        shell: pwsh
        run: |
          if (-not (Test-Path testdata\sample_faces.gif)) { python scripts/make_test_gif.py }
          Get-ChildItem testdata | Format-Table Name, Length

      - name: PyInstaller (onedir, GUI exe + console exe)
        shell: pwsh
        run: |
          pyinstaller GifFaceSwap.spec --noconfirm
          "{0:N1} MB" -f ((Get-ChildItem dist/GifFaceSwap -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Selftest - packaged GifFaceSwap_cli.exe (GIF + colour match + DirectML smoke)
        shell: pwsh
        run: |
          $out = "$PWD\selftest-out\cli"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & dist\GifFaceSwap\GifFaceSwap_cli.exe --selftest `
            --gif testdata\sample_faces.gif --photo testdata\faces_e5.jpg `
            --models "$PWD\.models-cache" --device cpu --enhance gpen256 `
            --max-short 320 --out $out --dml-smoke --color-match
          $code = $LASTEXITCODE
          Get-Content "$out\selftest_report.json"
          if ($code -ne 0) { throw "selftest failed: $code" }

      - name: DirectML failure → CPU fallback (process must stay alive)
        shell: pwsh
        run: |
          $out = "$PWD\selftest-out\dml-fallback"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:GFS_FORCE_DML_FAIL = "1"
          & dist\GifFaceSwap\GifFaceSwap_cli.exe --test-dml-fallback `
            --models "$PWD\.models-cache" --out $out
          $code = $LASTEXITCODE
          Remove-Item Env:GFS_FORCE_DML_FAIL -ErrorAction SilentlyContinue
          Get-Content "$out\dml_fallback_report.json"
          if ($code -ne 0) { throw "dml fallback test failed: $code" }

      - name: Selftest - packaged windowed GifFaceSwap.exe
        shell: pwsh
        run: |
          $out = "$PWD\selftest-out\gui_exe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath dist\GifFaceSwap\GifFaceSwap.exe -PassThru -Wait -ArgumentList @(
            "--selftest", "--gif", "`"$PWD\testdata\sample_faces.gif`"", "--photo", "`"$PWD\testdata\faces_e5.jpg`"",
            "--models", "`"$PWD\.models-cache`"", "--device", "cpu", "--enhance", "off",
            "--max-short", "320", "--out", "`"$out`"")
          Write-Host "exit code $($p.ExitCode)"
          Get-Content "$out\selftest_report.json"
          if ($p.ExitCode -ne 0) { throw "windowed selftest failed" }

      - name: GUI launch smoke
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path screens-ci | Out-Null
          $env:GFS_MODELS = "$PWD\.models-cache"
          $p = Start-Process -FilePath dist\GifFaceSwap\GifFaceSwap.exe -PassThru -ArgumentList @(
            "--models", "`"$PWD\.models-cache`"")
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Write-Host "GUI process alive after 30 s: $alive"
          "alive=$alive" | Out-File selftest-out\gui_launch.txt
          if ($alive) { Stop-Process -Id $p.Id -Force } else { throw "GUI exited early: $($p.ExitCode)" }

      - name: Make portable zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/make_zip.ps1
          Get-ChildItem dist\*.zip | Format-Table Name, Length
          Get-Content dist\SHA256SUMS

      - name: Anonymous zip verify (extract + SHA + GIF magic)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\GifFaceSwap-*-win64.zip | Select-Object -First 1
          $tmp = Join-Path $env:TEMP "gfs-anon-verify"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive $zip.FullName -DestinationPath $tmp
          $exe = Get-ChildItem $tmp -Recurse -Filter GifFaceSwap_cli.exe | Select-Object -First 1
          if (-not $exe) { throw "cli exe missing from zip" }
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content dist\SHA256SUMS | Select-Object -First 1).Split()[0].ToLower()
          if ($sha -ne $expected) { throw "SHA mismatch $sha vs $expected" }
          $gif = Get-ChildItem selftest-out\cli\selftest_output.gif | Select-Object -First 1
          $hdr = [System.IO.File]::ReadAllBytes($gif.FullName)[0..5]
          $mag = [System.Text.Encoding]::ASCII.GetString($hdr)
          if ($mag -ne "GIF89a" -and $mag -ne "GIF87a") { throw "bad gif magic $mag" }
          Write-Host "anonymous zip OK: $($zip.Name) sha=$sha exe=$($exe.FullName) gif=$mag size=$($gif.Length)"

      - name: Upload build + test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GifFaceSwap-win64-tests
          path: |
            selftest-out/**
            screens-ci/**
            dist/SHA256SUMS

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GifFaceSwap-win64-zip
          path: dist/GifFaceSwap-*-win64.zip
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist\GifFaceSwap-*-win64.zip | Select-Object -First 1
          $ver = $zip.Name -replace '^GifFaceSwap-(.+)-win64\.zip$', '$1'
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$ver" }
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $r = Get-Content selftest-out\cli\selftest_report.json -Raw | ConvertFrom-Json
          $lines = @(
            "GIF Face Swap **$ver** — portable Windows 10/11 x64 for the ASUS ROG Ally X (Radeon 780M, DirectML).",
            "FaceFusion-class pipeline: YOLO Face + ArcFace + inswapper_128 fp16 + optional GPEN.",
            "Body/skin colour match (Reinhard LAB) to the GIF subject is **on by default**; optional colour-look reference image supported.",
            "",
            "| Asset | Size | SHA-256 |",
            "|---|---|---|",
            "| $($zip.Name) | $($zip.Length) bytes | ``$sha`` |",
            "",
            "### First run (Ally X)",
            "1. Unzip, open the GifFaceSwap folder, run **GifFaceSwap.exe**.",
            "2. **SmartScreen** (unsigned): click **More info** then **Run anyway**.",
            "3. Download AI models when asked (~465 MB required). Reuses Face Fusion Studio models if already present.",
            "4. Pick animated GIF + face photo → Create. Output: Pictures\\GifFaceSwap\\",
            "",
            "### GIF limits",
            "- Max 80 frames (evenly subsampled), 12 s, short side ≤ 480 px (Options up to 720), file ≤ 25 MB",
            "- Valid GIF89a (LZW Clear at current width + Global Color Table) — opens in Photos/browsers",
            "",
            "### CI",
            "- Selftest GIF (CPU, Light enhancer, colour match): ok=$($r.ok)",
            "- Checks: $(($r.checks | ConvertTo-Json -Compress))",
            "",
            "**Does not touch** face-fusion-windows or face-swap-video-windows releases.",
            "Android GIF app (gif-face-swap) is a separate product."
          )
          $lines -join "`n" | Out-File -Encoding utf8 notes.md
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip.FullName dist\SHA256SUMS --title "GIF Face Swap for Windows $tag" --notes-file notes.md
          } else {
            gh release upload $tag $zip.FullName dist\SHA256SUMS --clobber
            gh release edit $tag --notes-file notes.md
          }
